<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526B91"/></marker></defs><rect width="1600" height="900" fill="#FBFCFF"/><rect x="58" y="48" width="8" height="85" fill="#695CA7"/><text x="82" y="67" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#695CA7" font-weight="700">PERSONGEN · ИДЕЯ И РЕЗУЛЬТАТ</text><text x="82" y="126" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" fill="#1A2638" font-weight="700">Персонализация диффузионной модели через AlphaEdit</text><text x="82" y="180" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#536276" font-weight="400">Переносим концепт из LoRA-учителя, меняя только K/V-проекции cross-attention U-Net</text><path d="M82 205 H1515" stroke="#E2E7F0" stroke-width="2"/><rect x="82" y="247" width="390" height="159" rx="20" fill="#ECE7FB" stroke="#B8A9ED" stroke-width="2"/><text x="105" y="287" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" fill="#695CA7" font-weight="700">1   LoRA-учитель</text><text x="105" y="337" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#1A2638" font-weight="400">Изображения корги и</text><text x="105" y="373" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#1A2638" font-weight="400">персональный токен</text><rect x="82" y="430" width="390" height="159" rx="20" fill="#E5F5F1" stroke="#92C9BD" stroke-width="2"/><text x="105" y="470" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" fill="#087B70" font-weight="700">2   Сохраняемые знания</text><text x="105" y="520" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#1A2638" font-weight="400">Обычные промпты</text><text x="105" y="556" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#1A2638" font-weight="400">без спецтокена</text><rect x="525" y="242" width="554" height="347" rx="23" fill="#FFFFFF" stroke="#CBD7E9" stroke-width="2"/><rect x="550" y="267" width="504" height="46" rx="14" fill="#E9F1FB" stroke="#E9F1FB" stroke-width="2"/><text x="802" y="298" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" fill="#235B91" font-weight="700">АНАЛИТИЧЕСКАЯ ПРАВКА БЕЗ ДООБУЧЕНИЯ</text><rect x="558" y="341" width="231" height="61" rx="16" fill="#F2EEFE" stroke="#F2EEFE" stroke-width="2"/><text x="672" y="380" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" text-anchor="middle" fill="#695CA7" font-weight="700">Y = Wᴸᵒᴿᴬ Xₚₑᵣₛ</text><rect x="804" y="341" width="245" height="61" rx="16" fill="#EBF9F6" stroke="#EBF9F6" stroke-width="2"/><text x="926" y="380" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" text-anchor="middle" fill="#087B70" font-weight="700">P = I − Vᵣ Vᵣᵀ</text><text x="803" y="473" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" text-anchor="middle" fill="#1A2638" font-weight="700">W_new = W_base + ΔW · P</text><text x="803" y="536" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" text-anchor="middle" fill="#536276" font-weight="400">Только матрицы to_k и to_v</text><path d="M474 320 L521 355" fill="none" stroke="#695CA7" stroke-width="4" marker-end="url(#arr)"/><path d="M474 504 L521 462" fill="none" stroke="#087B70" stroke-width="4" marker-end="url(#arr)"/><path d="M1083 420 L1115 420" fill="none" stroke="#235B91" stroke-width="4" marker-end="url(#arr)"/><rect x="1120" y="250" width="395" height="332" rx="20" fill="#F6F8FD" stroke="#CBD7E9" stroke-width="2"/><text x="1318" y="299" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" text-anchor="middle" fill="#1A2638" font-weight="700">Новая Stable Diffusion</text><path d="M1153 324 H1481" stroke="#D7DEEA" stroke-width="2"/><rect x="1150" y="343" width="331" height="44" rx="15" fill="#ECE7FB" stroke="#ECE7FB" stroke-width="2"/><text x="1316" y="372" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#695CA7" font-weight="700">c персональным токеном</text><text x="1316" y="421" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" fill="#695CA7" font-weight="700">Концепт переносится частично</text><rect x="1150" y="444" width="331" height="44" rx="15" fill="#E5F5F1" stroke="#E5F5F1" stroke-width="2"/><text x="1316" y="473" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" fill="#087B70" font-weight="700">без персонального токена</text><text x="1316" y="527" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" fill="#087B70" font-weight="700">Базовое поведение сохраняется</text><rect x="82" y="628" width="1433" height="217" rx="24" fill="#F5F8FC" stroke="#E2E8F1" stroke-width="2"/><text x="110" y="673" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#536276" font-weight="700">ЭКСПЕРИМЕНТАЛЬНАЯ ПРОВЕРКА ПРОЕКТОРА</text><text x="110" y="709" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#536276" font-weight="400">Доля нормы текстовых представлений после проекции</text><text x="110" y="754" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#1A2638" font-weight="700">Обычные  X₀</text><text x="110" y="814" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#1A2638" font-weight="700">Персональные  Xₚₑᵣₛ</text><rect x="405" y="739" width="393" height="19" rx="6" fill="#E5E9F1" stroke="#E5E9F1" stroke-width="2"/><rect x="405" y="799" width="393" height="19" rx="6" fill="#E5E9F1" stroke="#E5E9F1" stroke-width="2"/><rect x="405" y="739" width="3" height="19" fill="#087B70"/><rect x="405" y="799" width="355" height="19" rx="6" fill="#695CA7" stroke="#695CA7" stroke-width="2"/><text x="820" y="755" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#087B70" font-weight="700">≈ 0%</text><text x="820" y="815" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#695CA7" font-weight="700">90,35%</text><path d="M976 667 V811" stroke="#D9E1EC" stroke-width="2"/><rect x="1000" y="663" width="270" height="40" rx="12" fill="#ECE7FB" stroke="#ECE7FB" stroke-width="2"/><text x="1135" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" fill="#695CA7" font-weight="700">КЛЮЧЕВОЙ ВЫВОД</text><text x="1004" y="745" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#1A2638" font-weight="700">Проекция защищает базовые</text><text x="1004" y="776" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#1A2638" font-weight="700">направления; K/V пока</text><text x="1004" y="808" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#1A2638" font-weight="700">недостаточно для точной идентичности</text><text x="84" y="878" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#6D7A8B" font-weight="400">Диагностика: ручной X₀, r = 38  ·  Качество генерации оценено качественно</text></svg>