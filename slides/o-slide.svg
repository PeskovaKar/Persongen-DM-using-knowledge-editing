<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#FAFAF8"/>
<text x="88" y="101" font-family="Inter, Arial, sans-serif" font-size="42" fill="#202733" font-weight="700" letter-spacing="0">Персонализация диффузионной модели через редактирование K/V</text>
<text x="90" y="158" font-family="Inter, Arial, sans-serif" font-size="22" fill="#67717C" font-weight="400" letter-spacing="0">DreamBooth LoRA   +   AlphaEdit       ·       Stable Diffusion v1.4</text>
<path d="M88 186L1522 186" fill="none" stroke="#DBDEE0" stroke-width="2"/>
<text x="89" y="228" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B6878" font-weight="700" letter-spacing="2">П О Д Х О Д</text>
<text x="91" y="282" font-family="Inter, Arial, sans-serif" font-size="27" fill="#4B6878" font-weight="700" letter-spacing="0">01</text>
<text x="171" y="281" font-family="Inter, Arial, sans-serif" font-size="29" fill="#202733" font-weight="700" letter-spacing="0">DreamBooth LoRA — персонализированный учитель</text>
<text x="171" y="327" font-family="Inter, Arial, sans-serif" font-size="22" fill="#67717C" font-weight="400" letter-spacing="0">Обучаем новый объект на небольшом наборе изображений.</text>
<path d="M120 311L120 385" fill="none" stroke="#CBD3D6" stroke-width="2"/>
<text x="91" y="407" font-family="Inter, Arial, sans-serif" font-size="27" fill="#4B6878" font-weight="700" letter-spacing="0">02</text>
<text x="171" y="407" font-family="Inter, Arial, sans-serif" font-size="29" fill="#202733" font-weight="700" letter-spacing="0">AlphaEdit — перенос знаний от учителя</text>
<text x="171" y="453" font-family="Inter, Arial, sans-serif" font-size="22" fill="#67717C" font-weight="400" letter-spacing="0">Xₚₑᵣₛ — промпты с идентификатором, X₀ — обычные промпты.</text>
<text x="171" y="483" font-family="Inter, Arial, sans-serif" font-size="22" fill="#67717C" font-weight="400" letter-spacing="0">По X₀ строим проектор P для защиты исходного поведения.</text>
<path d="M120 431L120 554" fill="none" stroke="#CBD3D6" stroke-width="2"/>
<text x="91" y="578" font-family="Inter, Arial, sans-serif" font-size="27" fill="#4B6878" font-weight="700" letter-spacing="0">03</text>
<text x="171" y="578" font-family="Inter, Arial, sans-serif" font-size="28" fill="#202733" font-weight="700" letter-spacing="0">Редактируем только K/V в cross-attention U-Net</text>
<text x="171" y="621" font-family="Inter, Arial, sans-serif" font-size="22" fill="#67717C" font-weight="400" letter-spacing="0">Обновление весов вычисляется аналитически, без нового обучения.</text>
<path d="M171 671L964 671" fill="none" stroke="#CAD2D6" stroke-width="2"/>
<text x="180" y="746" font-family="Cambria Math, Georgia, serif" font-size="48" fill="#202733"><tspan font-style="italic">W</tspan><tspan font-size="27" baseline-shift="sub">new</tspan><tspan> = W</tspan><tspan font-size="27" baseline-shift="sub">0</tspan><tspan> + ΔW · P</tspan></text>
<path d="M90 788L995 788" fill="none" stroke="#DBDEE0" stroke-width="2"/>
<text x="90" y="822" font-family="Inter, Arial, sans-serif" font-size="22" fill="#4B6878" font-weight="700" letter-spacing="0">Наблюдение</text>
<text x="240" y="815" font-family="Inter, Arial, sans-serif" font-size="19" fill="#202733" font-weight="400" letter-spacing="0">Базовое поведение сохраняется; перенос внешности объекта</text>
<text x="240" y="842" font-family="Inter, Arial, sans-serif" font-size="19" fill="#202733" font-weight="400" letter-spacing="0">пока неполный.</text>
<text x="90" y="882" font-family="Inter, Arial, sans-serif" font-size="15" fill="#9AA1A8" font-weight="400" letter-spacing="0">Карина Пескова  ·  PersonGen</text>
<text x="1103" y="231" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B6878" font-weight="700" letter-spacing="0.2">Р Е З У Л Ь Т А Т Ы    Г Е Н Е Р А Ц И И</text>
<rect x="1121" y="260" width="370" height="566" fill="#F7F7F5" stroke="#C5C9CB" stroke-width="2" stroke-dasharray="11 11"/>
<text x="1192" y="538" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9A9DA1" font-weight="400" letter-spacing="0">Место для вертикального</text>
<text x="1202" y="564" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9A9DA1" font-weight="400" letter-spacing="0">коллажа генераций</text>
<text x="1182" y="864" font-family="Inter, Arial, sans-serif" font-size="17" fill="#9AA1A8" font-weight="400" letter-spacing="0">Base / LoRA / AlphaEdit</text>
</svg>